version: '3.9'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: softwareengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: B!rds19671967
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: tail -f /dev/null 
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_NAME=delta_db
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=caonhatnam2003
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - SQL_HOST=db              # for wait-for-db.sh script
      - SQL_PORT=5432
      - PYTHONUNBUFFERED=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - .:/app
  

volumes:
  postgres_data:


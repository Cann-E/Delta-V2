{% extends 'basic_dashboard.html' %}  {# Use the base dashboard layout #}

{% block content %}
<style>
    /* Container for the signature form */
    .signature-container {
        max-width: 500px;
        margin: 60px auto;
        background-color: #fff;
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
    }

    /* Header title */
    .signature-container h2 {
        color: #1a237e;
        margin-bottom: 20px;
        font-size: 1.8rem;
    }

    /* Form style */
    .signature-container form {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 20px;
    }

    /* File input field style */
    .signature-container input[type="file"] {
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 8px;
    }

    /* Save button style */
    .btn-primary {
        background-color: #1a73e8;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
        background-color: #155cc4;
    }

    /* Logout button */
    .btn-danger {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 18px;
        background-color: #e53935;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
    }

    .btn-danger:hover {
        background-color: #c62828;
    }

    /* Display current signature */
    .current-signature {
        margin-top: 20px;
        text-align: center;
    }

    .current-signature img {
        max-width: 100%;
        height: auto;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin-top: 10px;
    }
</style>

<!-- Signature form section -->
<div class="signature-container">
    <h2>Upload Your Signature</h2>
    
    <!-- Upload form -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}  {# Protect the form #}
        {{ form.as_p }}   {# Render the signature form #}
        <button type="submit" class="btn-primary">Save Signature</button>
    </form>

    <!-- If the user already has a signature, show it -->
    {% if user.signature %}
    <div class="current-signature">
        <p>Current Signature:</p>
        <img src="{{ user.signature.url }}" alt="Your Signature">
    </div>
    {% endif %}

    <!-- Logout button -->
    <a href="{% url 'account_logout' %}" class="btn-danger">Logout</a>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Body styles */
        body {
            background-color: #181818;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Container for all content */
        .container {
            max-width: 900px;
            background-color: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.1);
        }

        /* Page title */
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Table appearance */
        .table {
            background-color: #333;
            color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        /* Table cells */
        th, td {
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        /* Table header */
        th {
            background-color: #4CAF50;
            color: white;
        }

        /* Custom buttons */
        .btn-custom {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            padding: 5px 12px;
        }

        .btn-custom:hover {
            background-color: #45a049;
        }

        /* Badge size */
        .badge {
            font-size: 14px;
            padding: 6px 12px;
        }
    </style>
</head>
<body>

<!-- Start of content box -->
<div class="container">
    <h2>My Requests</h2>

    <!-- Table for listing requests -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Request ID</th>
                <th>Type</th>
                <th>Status</th>
                <th>Created On</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for req in requests %}
            <tr>
                <!-- Show request details -->
                <td>{{ req.id }}</td>
                <td>{{ req.get_request_type_display }}</td>
                <td>
                    <!-- Badge color changes by status -->
                    <span class="badge 
                        {% if req.status == 'pending' %} bg-warning text-dark 
                        {% elif req.status == 'approved' %} bg-success 
                        {% elif req.status == 'returned' %} bg-danger 
                        {% else %} bg-secondary {% endif %}">
                        {{ req.get_status_display }}
                    </span>
                </td>
                <td>{{ req.date_created }}</td>
                <td>
                    <!-- View button for request -->
                    <a href="{% url 'request_detail' request_id=req.id %}" class="btn btn-custom">View</a>
                </td>
            </tr>
            {% empty %}
            <!-- Message if no requests -->
            <tr>
                <td colspan="5" class="text-center">No requests found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Back to home button -->
    <a href="{% url 'home' %}" class="btn btn-custom w-100">Back to Home</a>
</div>

<!-- Bootstrap JS for components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

{% block content %}
<div style="max-width: 600px; margin: auto; padding: 40px 20px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-radius: 12px;">
    <h2 style="color: #1a237e; text-align: center; margin-bottom: 20px;">
        {% if form.instance.pk %}Edit Approver{% else %}Add Approver{% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
            <button type="submit" style="background-color: #1a73e8; color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: 500;">
                {% if form.instance.pk %}Update{% else %}Add{% endif %}
            </button>
            <a href="{% url 'manage_approvers' %}" style="background-color: #eee; color: #333; padding: 10px 16px; border: none; border-radius: 6px; text-decoration: none;">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}

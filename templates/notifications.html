<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fc;
            margin: 0;
            padding: 40px 60px;
            color: #333;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #1a237e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trash-btn {
            background: none;
            border: none;
            cursor: pointer;
        }

        .trash-btn i {
            font-size: 1.4rem;
            color: #c0392b;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .user-table th, .user-table td {
            padding: 14px 20px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .user-table th {
            background-color: #f4f6fb;
            font-weight: 600;
            color: #555;
        }

        .user-table tr:hover {
            background-color: #f0f4ff;
        }

        .back-btn {
            margin-top: 30px;
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
        }

        .back-btn:hover {
            background-color: #155cc4;
        }
    </style>
</head>
<body>
<form method="post" action="{% url 'delete_notifications' %}">
    {% csrf_token %}
    <h1>
        Notifications
        <button type="submit" class="trash-btn" title="Delete selected">
            <i class="fas fa-trash"></i>
        </button>
    </h1>

    <table class="user-table">
        <thead>
            <tr>
                <th><input type="checkbox" id="select-all"></th>
                <th>From</th>
                <th>Message</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
        {% for note in notifications %}
            <tr>
                <td><input type="checkbox" name="notification_ids" value="{{ note.id }}"></td>
                <td>{{ note.recipient.username }}</td>
                <td>{{ note.message }}</td>
                <td>{{ note.created_at|date:"Y-m-d H:i" }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="4">No notifications yet.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</form>

<a href="{% url 'home' %}" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>

<script>
    document.getElementById('select-all').addEventListener('change', function () {
        const checkboxes = document.querySelectorAll('input[name="notification_ids"]');
        for (const box of checkboxes) {
            box.checked = this.checked;
        }
    });
</script>
</body>
</html>

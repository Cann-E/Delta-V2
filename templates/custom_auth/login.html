{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: #ff4d4d;
        font-family: Arial, sans-serif;
        text-align: center;
    }
    .container {
        max-width: 400px;
        margin: 100px auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
    }
    input, button {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
    }
</style>
{% endblock %}
